<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akshaya Vana | Environmental Project Tracker</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Charts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
</head>
<body>
    <div id="app">
        <!-- App content will be injected here -->
        <div class="auth-layout" id="initial-loader">
            <div class="animate-pulse flex flex-col items-center">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🌳</div>
                <div style="color: white; font-weight: 600;">Loading Akshaya Vana...</div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/app.js"></script>
    <script>
        // Initialize Lucide icons after any DOM updates
        function refreshIcons() {
            lucide.createIcons();
        }
    </script>
</body>
</html>
